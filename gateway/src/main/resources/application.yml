server:
  port: 8888

spring:
  application:
    name: Gateway
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        service-name: Gateway
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false
